e: #008080; stroke-width: 1.0;"/><line style="stroke: #008080; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="567" x2="744" y1="604.4735" y2="604.4735"/><text fill="#008080" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="95" x="584" y="593.9575">Demande traitée</text><polygon fill="#008080" points="271,640.8176,261,644.8176,271,648.8176,267,644.8176" style="stroke: #008080; stroke-width: 1.0;"/><line style="stroke: #008080; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="265" x2="556" y1="644.8176" y2="644.8176"/><text fill="#008080" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="40" x="282" y="634.3016">200 OK</text><polygon fill="#008080" points="56,681.1617,46,685.1617,56,689.1617,52,685.1617" style="stroke: #008080; stroke-width: 1.0;"/><line style="stroke: #008080; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="50" x2="259" y1="685.1617" y2="685.1617"/><text fill="#008080" font-family="sans-serif" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="131" x="67" y="674.6457">"Consultez vos e-mails"</text><!--MD5=[2ecb1551e5cdf99dc990ea9802b13d8a]
@startuml

skinparam shadowing false
skinparam roundcorner 8
skinparam Padding 5
skinparam defaultFontName "SansSerif"
skinparam defaultFontSize 12

skinparam ActivityBackgroundColor #F8F9FA
skinparam ActivityBorderColor #008080
skinparam ActivityDiamondBackgroundColor #E67E22
skinparam ActivityDiamondBorderColor #E67E22
skinparam ActivityDiamondFontColor #FFFFFF

skinparam ActorBackgroundColor #F8F9FA
skinparam ActorBorderColor #008080

skinparam ClassBackgroundColor #F8F9FA
skinparam ClassBorderColor #008080
skinparam ClassHeaderBackgroundColor #008080
skinparam ClassAttributeIconSize 0

skinparam ComponentBackgroundColor #F8F9FA
skinparam ComponentBorderColor #008080

skinparam DatabaseBackgroundColor #F8F9FA
skinparam DatabaseBorderColor #008080

skinparam NoteBackgroundColor #FFF2E6
skinparam NoteBorderColor #E67E22

skinparam StateBackgroundColor #F8F9FA
skinparam StateBorderColor #008080

skinparam UsecaseBackgroundColor #F8F9FA
skinparam UsecaseBorderColor #008080

skinparam SequenceGroupBackgroundColor #F8F9FA
skinparam SequenceGroupBorderColor #008080
skinparam SequenceLifeLineBorderColor #008080
skinparam SequenceParticipantBackgroundColor #F8F9FA
skinparam SequenceParticipantBorderColor #008080
skinparam ControlBackgroundColor #F8F9FA
skinparam ControlBorderColor #008080
skinparam BoundaryBackgroundColor #F8F9FA
skinparam BoundaryBorderColor #008080
skinparam EntityBackgroundColor #F8F9FA
skinparam EntityBorderColor #008080

skinparam ArrowColor #008080
skinparam ArrowFontColor #008080

skinparam PackageBackgroundColor #FFFFFF
skinparam PackageBorderColor #008080

actor "Utilisateur" as User
boundary "Page Login" as Front
control "Controller" as Controller
entity "Auth Service" as Service
entity "Email Service" as Mail
database "Base de données" as DB

User -> Front : Clique sur "Mot de passe oublié"
Front -> Controller : POST /api/auth/reset-password-request (email)
activate Controller

Controller -> Service : genererResetToken(email)
activate Service

Service -> DB : Vérifier email
activate DB
DB - -> Service : Utilisateur trouvé
deactivate DB

Service -> Service : Créer Token UUID sécurisé
Service -> DB : Enregistrer Token (Expiration 24h)
activate DB
DB - -> Service : OK
deactivate DB

Service -> Mail : envoyerLienReset(email, token)
activate Mail
Mail -> Mail : Envoi SMTP
Mail - -> Service : Mail envoyé
deactivate Mail

Service - -> Controller : Demande traitée
deactivate Service

Controller - -> Front : 200 OK
deactivate Controller

Front - -> User : "Consultez vos e-mails"

@enduml

