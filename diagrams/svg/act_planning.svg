54.3495,264.25,744.3495,260.25,748.3495" style="stroke: #008080; stroke-width: 1.0;"/><line style="stroke: #008080; stroke-width: 1.5;" x1="260.25" x2="260.25" y1="999.726" y2="1019.726"/><polygon fill="#008080" points="256.25,1009.726,260.25,1019.726,264.25,1009.726,260.25,1013.726" style="stroke: #008080; stroke-width: 1.0;"/><!--MD5=[2d3e14290b6b72996bb078167e2995a0]
@startuml

skinparam shadowing false
skinparam roundcorner 8
skinparam Padding 5
skinparam defaultFontName "SansSerif"
skinparam defaultFontSize 12

skinparam ActivityBackgroundColor #F8F9FA
skinparam ActivityBorderColor #008080
skinparam ActivityDiamondBackgroundColor #E67E22
skinparam ActivityDiamondBorderColor #E67E22
skinparam ActivityDiamondFontColor #FFFFFF

skinparam ActorBackgroundColor #F8F9FA
skinparam ActorBorderColor #008080

skinparam ClassBackgroundColor #F8F9FA
skinparam ClassBorderColor #008080
skinparam ClassHeaderBackgroundColor #008080
skinparam ClassAttributeIconSize 0

skinparam ComponentBackgroundColor #F8F9FA
skinparam ComponentBorderColor #008080

skinparam DatabaseBackgroundColor #F8F9FA
skinparam DatabaseBorderColor #008080

skinparam NoteBackgroundColor #FFF2E6
skinparam NoteBorderColor #E67E22

skinparam StateBackgroundColor #F8F9FA
skinparam StateBorderColor #008080

skinparam UsecaseBackgroundColor #F8F9FA
skinparam UsecaseBorderColor #008080

skinparam SequenceGroupBackgroundColor #F8F9FA
skinparam SequenceGroupBorderColor #008080
skinparam SequenceLifeLineBorderColor #008080
skinparam SequenceParticipantBackgroundColor #F8F9FA
skinparam SequenceParticipantBorderColor #008080
skinparam ControlBackgroundColor #F8F9FA
skinparam ControlBorderColor #008080
skinparam BoundaryBackgroundColor #F8F9FA
skinparam BoundaryBorderColor #008080
skinparam EntityBackgroundColor #F8F9FA
skinparam EntityBorderColor #008080

skinparam ArrowColor #008080
skinparam ArrowFontColor #008080

skinparam PackageBackgroundColor #FFFFFF
skinparam PackageBorderColor #008080

<style>
mindmapDiagram {
  node {
    BackgroundColor #F8F9FA
    LineColor #008080
    FontColor #000000
  }
  rootNode {
    BackgroundColor #008080
    FontColor #FFFFFF
    FontStyle bold
  }
  leafNode {
    BackgroundColor #FFFFFF
  }
  arrow {
    LineColor #008080
  }
}
</style>

start
:Administrateur définit la Session globale;
:Coordinateur accède à la session globale;

repeat
    :Planification d'une soutenance individuelle\n(Étudiant, Salle, Date, Créneau);
    :Validation automatique des contraintes (RG1, RG2, RG3, RG5, RG6);
    if (Conflits détectés ?) then (Oui)
        :Afficher alertes de conflit;
        :Ajuster les paramètres du créneau;
    else (Non)
        :Enregistrer la planification individuelle;
        :Statut session -> SCHEDULED;
    endif
repeat while (D'autres soutenances à planifier ?) is (Oui)

:Affectation des jurys par;
:Vérification RG4 (conflit encadrant);

if (Planning Complet ?) then (Oui)
    :Validation finale et verrouillage;
    :Génération massive des convocations;
    :Statut session -> COMPLETED;
else (Non)
    :Finaliser les affectations manquantes;
endif

stop
@enduml

