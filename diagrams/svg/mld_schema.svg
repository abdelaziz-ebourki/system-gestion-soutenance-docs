lengthAdjust="spacingAndGlyphs" textLength="51" x="13" y="405.3583">arrow {</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="127" x="21" y="424.4263">LineColor #008080</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="6" x="13" y="443.4942">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="6" x="5" y="462.5621">}</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="55" x="5" y="481.63">&lt;/style&gt;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="500.6979"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="181" x="5" y="519.7658">skinparam Linetype ortho</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="538.8338"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="9" y="557.9017"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="411" x="5" y="576.9696">entity "defense_settings" as defsettings &lt;&lt; (T, #c2ccd7) &gt;&gt; {</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="93" x="9" y="596.0375">Syntax Error?</text><!--MD5=[67913aa23337c8820e0140f7f6701ab3]
@startuml

skinparam shadowing false
skinparam roundcorner 8
skinparam Padding 5
skinparam defaultFontName "SansSerif"
skinparam defaultFontSize 12

skinparam ActivityBackgroundColor #F8F9FA
skinparam ActivityBorderColor #008080
skinparam ActivityDiamondBackgroundColor #E67E22
skinparam ActivityDiamondBorderColor #E67E22
skinparam ActivityDiamondFontColor #FFFFFF

skinparam ActorBackgroundColor #F8F9FA
skinparam ActorBorderColor #008080

skinparam ClassBackgroundColor #F8F9FA
skinparam ClassBorderColor #008080
skinparam ClassHeaderBackgroundColor #008080
skinparam ClassAttributeIconSize 0

skinparam ComponentBackgroundColor #F8F9FA
skinparam ComponentBorderColor #008080

skinparam DatabaseBackgroundColor #F8F9FA
skinparam DatabaseBorderColor #008080

skinparam NoteBackgroundColor #FFF2E6
skinparam NoteBorderColor #E67E22

skinparam StateBackgroundColor #F8F9FA
skinparam StateBorderColor #008080

skinparam UsecaseBackgroundColor #F8F9FA
skinparam UsecaseBorderColor #008080

skinparam SequenceGroupBackgroundColor #F8F9FA
skinparam SequenceGroupBorderColor #008080
skinparam SequenceLifeLineBorderColor #008080
skinparam SequenceParticipantBackgroundColor #F8F9FA
skinparam SequenceParticipantBorderColor #008080
skinparam ControlBackgroundColor #F8F9FA
skinparam ControlBorderColor #008080
skinparam BoundaryBackgroundColor #F8F9FA
skinparam BoundaryBorderColor #008080
skinparam EntityBackgroundColor #F8F9FA
skinparam EntityBorderColor #008080

skinparam ArrowColor #008080
skinparam ArrowFontColor #008080

skinparam PackageBackgroundColor #FFFFFF
skinparam PackageBorderColor #008080

<style>
mindmapDiagram {
  node {
    BackgroundColor #F8F9FA
    LineColor #008080
    FontColor #000000
  }
  rootNode {
    BackgroundColor #008080
    FontColor #FFFFFF
    FontStyle bold
  }
  leafNode {
    BackgroundColor #FFFFFF
  }
  arrow {
    LineColor #008080
  }
}
</style>

skinparam Linetype ortho


entity "defense_settings" as defsettings << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  start_time : VARCHAR
  end_time : VARCHAR
  defense_duration : INT
  break_duration : INT
  group_creation_start_date : VARCHAR
  group_creation_end_date : VARCHAR
}

entity "audit_log" as audit << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  action : VARCHAR
  entity : VARCHAR
  entity_id : BIGINT
  performed_by_email : VARCHAR
  details : TEXT
  timestamp : TIMESTAMP
}

entity "notification" as notif << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  type : ENUM(SUCCESS,WARNING,ERROR,INFO,REMINDER)
  title : VARCHAR
  message : TEXT
  timestamp : TIMESTAMP
  read : BOOLEAN
  action_link : VARCHAR
  actor : VARCHAR
}

entity "unavailability" as unavail << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  teacher_id : BIGINT
  date : VARCHAR
}

entity "unavailability_slots" as uslots << (T, #c2ccd7) >> {
  * unavailability_id : BIGINT (PK, FK→unavailability)
  * slot : VARCHAR (PK)
}

entity "student_document" as sdoc << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  student_id : BIGINT
  name : VARCHAR
  type : VARCHAR
  deadline : VARCHAR
  status : VARCHAR
  submitted_at : TIMESTAMP
  file_path : VARCHAR
}

unavailability ||- -|{ uslots


entity "users" as users << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  dtype : VARCHAR
  email : VARCHAR (U)
  password : VARCHAR
  role : ENUM(ADMIN,COORDINATOR,TEACHER,STUDENT)
  last_name : VARCHAR
  first_name : VARCHAR
  is_active : BOOLEAN
  verification_token : VARCHAR
  reset_token : VARCHAR
  reset_token_expires : TIMESTAMP
}

entity "student" as student << (T, #c2ccd7) >> {
  * id : BIGINT (PK, FK→users)
  - -
  cne : VARCHAR
  code_apogee : VARCHAR (U)
  major_id : BIGINT (FK→major)
  level_id : BIGINT (FK→level)
}

entity "teacher" as teacher << (T, #c2ccd7) >> {
  * id : BIGINT (PK, FK→users)
  - -
  department_id : BIGINT (FK→department)
}

entity "coordinator" as coordinator << (T, #c2ccd7) >> {
  * id : BIGINT (PK, FK→users)
}

entity "faculty" as faculty << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  name : VARCHAR
  code : VARCHAR
  dean_id : BIGINT (FK→teacher)
  logo_url : VARCHAR
}

entity "department" as dept << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  name : VARCHAR
  code : VARCHAR
  head_id : BIGINT (FK→teacher)
  faculty_id : BIGINT (FK→faculty)
}

entity "level" as level << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  name : VARCHAR
}

entity "major" as major << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  name : VARCHAR
}

entity "room" as room << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  name : VARCHAR
  capacity : INT
  department_id : BIGINT (FK→department)
}

entity "jury_role_template" as jrtemplate << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  name : VARCHAR (U)
  defense_type : ENUM(PFE,MEMOIRE,THESE)
}

entity "jury_role_template_roles" as jrtroles << (T, #c2ccd7) >> {
  * jury_role_template_id : BIGINT (PK, FK→jury_role_template)
  * name : VARCHAR (PK)
  - -
  count : INT
  coefficient : INT
}

entity "defense_session" as defsession << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  name : VARCHAR
  defense_type : ENUM(PFE,MEMOIRE,THESE)
  status : ENUM(DRAFT,ACTIVE,SCHEDULED,COMPLETED,ARCHIVED)
  max_group_size : INT
  defense_duration : INT
  break_duration : INT
  submission_deadline : DATE
  start_date : DATE
  end_date : DATE
  is_frozen : BOOLEAN
  approved_by : BIGINT
  approved_at : TIMESTAMP
  jury_role_template_id : BIGINT (FK→jury_role_template)
}

entity "defense_session_coefficients" as dscoeffs << (T, #c2ccd7) >> {
  * defense_session_id : BIGINT (PK, FK→defense_session)
  * role_name : VARCHAR (PK)
  - -
  coefficient : INT
}

entity "project" as project << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  title : VARCHAR
  description : TEXT
  defense_type : VARCHAR
  status : ENUM(PENDING,APPROVED,REJECTED)
  supervisor_id : BIGINT (FK→teacher)
}

entity "project_students" as pstudents << (T, #c2ccd7) >> {
  * project_id : BIGINT (PK, FK→project)
  * student_id : BIGINT (PK, FK→student)
}

entity "coordinator_group" as cgroup << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  group_name : VARCHAR (U)
  project_id : BIGINT (FK→project)
  session_id : BIGINT
  leader_id : BIGINT
}

entity "group_members" as gmembers << (T, #c2ccd7) >> {
  * group_id : BIGINT (PK, FK→coordinator_group)
  * student_id : BIGINT (PK, FK→student)
}

entity "defense" as defense << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  date : DATE
  time : TIME
  project_id : BIGINT (FK→project, U)
  room_id : BIGINT (FK→room)
}

entity "defense_members" as dmembers << (T, #c2ccd7) >> {
  * defense_id : BIGINT (PK, FK→defense)
  * teacher_id : BIGINT (FK→teacher)
  * role_name : VARCHAR (PK)
}

entity "evaluation" as eval << (T, #c2ccd7) >> {
  * id : BIGINT (PK)
  - -
  teacher_id : BIGINT
  defense_session_id : BIGINT
  role : VARCHAR
  score : FLOAT
  comment : TEXT
  status : ENUM(PENDING,SUBMITTED)
  submitted_at : TIMESTAMP
  attendance_status : ENUM(PRESENT,ABSENT,DEFAILLANT)
  defense_id : BIGINT (FK→defense)
}


users ||- -o| student
users ||- -o| teacher
users ||- -o| coordinator

student }o- -|| major
student }o- -|| level

teacher }o- -|| dept

dept }o- -|| faculty
faculty ||- -o{ teacher : dean
dept ||- -o{ teacher : head

room }o- -|| dept

project }o- -|| teacher : supervisor
project ||- -|{ pstudents
student ||- -|{ pstudents

cgroup }o- -|| project
cgroup ||- -|{ gmembers
student ||- -|{ gmembers

defense ||- -|| project
defense }o- -|| room
defense ||- -|{ dmembers
teacher ||- -o{ dmembers

defsession ||- -|{ dscoeffs
defsession }o- -|| jrtemplate
jrtemplate ||- -|{ jrtroles

defsession ||- -o{ cgroup : session_id

eval }o- -|| defense

@enduml

